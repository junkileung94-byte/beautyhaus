    /* Stamp a source on third-party destinations so Square / Viola can see the

    var NO_UTM = /(^|\.)(amazon\.[a-z.]+|amzn\.to|g\.page|goo\.gl)$/i;
    function tagged(href, campaign) {
      var u;
      try { u = new URL(href, location.href); } catch (e) { return href; }
      if (u.hostname === location.hostname) return href;
      if (NO_UTM.test(u.hostname)) return href;
      if (u.searchParams.has("utm_source")) return href;   // author set their own

          // js/track.js reads these into the event props, so the dashboard shows

          a.setAttribute("data-bio-id", id);
