<style>
  :root {
    --lilac-1:#FBF5FF; --lilac-2:#E8DBF1; --lilac-3:#EBD2FD; --lilac-4:#D4B0EE;
    --ink: oklch(21% 0.012 311);
    --ink-2: oklch(34% 0.012 311);
    --muted: oklch(45% 0.014 311);
    --accent: oklch(52% 0.115 80);
    --focus: oklch(52% 0.18 80);
    --font-display:"Playfair Display","Georgia",ui-serif,serif;
    --font-body:"Jost",ui-sans-serif,system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(1rem,4vw,2.5rem); text-align:center;
    color:var(--ink); font-family:var(--font-body); font-weight:300; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(168deg,var(--lilac-1) 0%,var(--lilac-2) 32%,var(--lilac-3) 66%,var(--lilac-4) 100%);
    background-attachment:fixed;
  }
  .card{
    width:100%; max-width:28rem;
    background:rgba(255,255,255,0.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.15); backdrop-filter:blur(16px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.65); border-radius:20px;
    box-shadow:0 24px 60px -28px rgba(40,20,55,0.4);
    padding:clamp(1.5rem,5vw,2.5rem);
  }
  .crown{ width:44px; height:auto; margin:0 auto 1rem; display:block; }
  .label{ font-size:0.72rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--muted); margin:0; }
  h1{ font-family:var(--font-display); font-weight:500; font-size:clamp(1.7rem,7vw,2.1rem);
      line-height:1.1; letter-spacing:-0.015em; margin:0.5rem 0 0; }
  p.lede{ color:var(--ink-2); margin:0.85rem 0 1.5rem; }
  .btn{
    display:inline-block; padding:0.9rem 1.6rem; border-radius:999px;
    background:var(--ink); color:#fff; text-decoration:none;
    font-size:0.9rem; letter-spacing:0.04em;
  }
  .alt{ display:block; margin-top:1rem; font-size:0.85rem; color:var(--muted); }
  .alt a{ color:var(--accent); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
