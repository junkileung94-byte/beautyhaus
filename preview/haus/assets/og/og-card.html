<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    display: grid; place-items: center;
    font-family: var(--font-body); color: var(--color-ink);
    background:
      radial-gradient(120% 90% at 12% -10%, var(--color-lilac-1) 0%, transparent 55%),
      radial-gradient(120% 100% at 92% 110%, var(--color-lilac-4) 0%, transparent 55%),
      linear-gradient(158deg, var(--color-lilac-1) 0%, var(--color-lilac-2) 38%, var(--color-lilac-3) 74%, var(--color-lilac-4) 100%);
  }
  /* thin champagne frame */
  .frame {
    position: absolute; inset: 40px; border: 1.5px solid oklch(52% 0.115 80 / 0.5);
    border-radius: 24px;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 34px; height: 34px;
    border: 1.5px solid var(--color-accent);
  }
  .frame::before { top: -1.5px; left: -1.5px; border-right: 0; border-bottom: 0; border-radius: 24px 0 0 0; }
  .frame::after  { bottom: -1.5px; right: -1.5px; border-left: 0; border-top: 0; border-radius: 0 0 24px 0; }

  .stack { display: grid; justify-items: center; text-align: center; gap: 0; z-index: 1; padding: 0 90px; }
  .crown { height: 118px; margin-bottom: 26px; }
  .wordmark { height: 62px; }
  .rule {
    width: 190px; height: 1.5px; margin: 30px 0 26px;
    background: linear-gradient(to right, transparent, var(--color-accent) 22%, var(--color-accent) 78%, transparent);
  }
  .tagline {
    font-family: var(--font-display); font-weight: 600; font-size: 68px; line-height: 1.04;
    letter-spacing: -0.01em; color: var(--color-ink);
  }
  .tagline em { font-style: italic; color: var(--color-accent); }
  .kicker {
    margin-top: 30px; font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase;
    font-weight: 400; color: var(--color-ink-2);
  }
  .locs {
    margin-top: 14px; font-size: 20px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--color-accent); font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <div class="stack">
      <img class="crown" src="../logo-crown.png" alt="">
      <img class="wordmark" src="../logo-wordmark.png" alt="Beauty Extension Haus">
      <div class="rule"></div>
      <div class="tagline">Your hair… but <em>better</em>.</div>
      <div class="kicker">Hair Extensions &amp; Custom Color</div>
      <div class="locs">Barrie, ON&nbsp;&nbsp;·&nbsp;&nbsp;Sarasota, FL</div>
    </div>
  </div>
</body>
</html>
