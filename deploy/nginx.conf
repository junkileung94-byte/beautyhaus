# Legacy-URL 301 map (old Weebly/Square site → current pages). Case-insensitive,
# tolerant of a trailing slash. Empty default = no redirect. Evaluated per-request
# before the server blocks below.
map $uri $bh_301 {
    default                 "";
    ~*^/why-nanos/?$        /why-nano.html;
    ~*^/prices/?$           /services.html;
    ~*^/shop-nanos/?$       /services.html;
    ~*^/s/appointments/?$   /services.html;
    ~*^/faq/?$              /care.html;
    ~*^/aftercare/?$        /care.html;
    ~*^/gallery/?$          /#gallery;
    ~*^/nowhiring/?$        /trade.html;
    ~*^/contact-us/?$       /#contact;
    ~*^/client-waitlist/?$  /nano-bead-hair-extensions-sarasota.html;
}

# www → apex. Cloudflared routes www.beautyextensionhaus.com to this same nginx;
# collapse it to the canonical host in one edge-cacheable 301.
server {
    listen 80;
    server_name www.beautyextensionhaus.com;
    return 301 https://beautyextensionhaus.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers — behind the Cloudflare tunnel nginx only sees
    # http://, so an absolute redirect would bounce visitors https→http→https.
    absolute_redirect off;

    # Security headers. `always` so they also apply to error responses.
    # No Content-Security-Policy on purpose — Square/Mangomint booking overlays
    # and Google Fonts would need a carefully enumerated policy; a wrong one
    # silently breaks booking. Add it deliberately, not by default.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Framing: frame-ancestors supersedes X-Frame-Options and, unlike it, can name an allowed
    # origin. thisisyours.site embeds this site live in its /work portfolio; every other origin
    # is still refused, exactly as SAMEORIGIN refused them. This is the ONLY directive in the
    # header on purpose — a broad CSP is what the note above warns against, and it would be the
    # thing that silently breaks Square/Mangomint booking.
    # Revert: add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://thisisyours.site" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Legacy-URL 301s (map above).
    if ($bh_301) { return 301 $bh_301; }

    # Real 404 page. NOTE: no `=` before /404.html — the `=` form would rewrite
    # the status to 200 and soft-404 the whole site.
    error_page 404 /404.html;
    # `no-store` so Cloudflare never holds a 404 for a path that later starts
    # working (it defaults to caching 404s for hours — that bit the tracker URL).
    location = /404.html { internal; add_header Cache-Control "no-store" always; }

    # Uploads (photo/video apply) go through /api/* to the admin container.
    client_max_body_size 512m;

    # Confidential — the /admin "Documents" strategy docs live under preview/haus/docs.
    # Never serve them to the public internet.
    location ^~ /docs/ { return 404; }

    # Public contact receiver (deploy/contact). Exact match — wins over /api/ below,
    # so it stays PUBLIC (no auth) while every other /api/* is gated.
    location = /api/message {
        limit_except POST { deny all; }
        proxy_pass http://contact:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Booking webhooks (deploy/hooks): Square and Mangomint POST here when an
    # appointment is booked. PUBLIC by necessity — the receiver authenticates
    # each delivery itself (Square HMAC signature, Mangomint shared secret).
    # `^~` with a longer prefix than the admin's `^~ /api/` below, so it wins.
    location ^~ /api/hook/ {
        limit_except POST { deny all; }
        proxy_pass http://hooks:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Plausible analytics — first-party proxy so ad-blockers don't eat it (tracker
    # + ingestion served same-origin). Reaches the Plausible CE container over the
    # `plausible_default` network (see docker-compose.yml). EXACT matches only —
    # /js/script.js must not shadow the site's own /js/haus.js etc., and /api/event
    # must stay PUBLIC, winning over the app-gated `^~ /api/` below.
    location = /js/script.js {
        proxy_pass http://plausible:8000/js/script.js;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
    # Tracker variant the site actually loads: pageview-props re-reads the
    # `event-*` attributes on its own <script> tag at every event, which is how
    # js/track.js stamps locale=ca|us onto pageviews, engagement (time + scroll)
    # and custom events alike. Exact match, same reasons as above. The plain
    # script.js above stays for any cached HTML still asking for it.
    location = /js/script.pageview-props.js {
        proxy_pass http://plausible:8000/js/script.pageview-props.js;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /api/event {
        limit_except POST { deny all; }
        proxy_pass http://plausible:8000/api/event;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Admin. Auth lives in the app itself (haus_auth.py: password + passkey). ----
    location ^~ /admin {
        proxy_pass           http://admin:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout   300s;   # Drive sync / large ops
    }
    location ^~ /api/ {
        proxy_pass           http://admin:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout   300s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: always revalidate. Without a Cache-Control header browsers fall back to
    # HEURISTIC caching (a fraction of the file's age) and Chrome will happily keep
    # serving yesterday's markup for days — which pins visitors to the OLD
    # `?v=` on css/haus.css and js/haus.js, so a shipped fix never reaches them.
    # `no-cache` still allows 304s, so this costs a conditional request, not a re-download.
    location ~* \.html$ {
        # nginx drops ALL inherited add_header directives as soon as a level
        # declares one of its own, so the server-level security headers above have
        # to be repeated here verbatim — otherwise every page loses HSTS and the
        # frame-ancestors policy. Keep these in sync with the server block.
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://thisisyours.site" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Photos. NOTE: WebP twins exist on disk (tools/gen_webp.py, ~38% smaller) but
    # are NOT served by Accept-negotiation — Cloudflare's free plan ignores
    # `Vary: Accept` and would cache one variant for everyone, handing WebP to
    # browsers that cannot render it. Serving them needs either CF Polish (paid)
    # or <picture> sources wired through the admin upload path.
    location ~* \.(?:png|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else static: long cache. nginx serves Range (206) for <video>.
    location ~* \.(?:css|js|webp|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
