server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # Uploads (photo/video apply) go through /api/* to the admin container.
    client_max_body_size 512m;

    # Confidential — the /admin "Documents" strategy docs live under preview/haus/docs.
    # Never serve them to the public internet.
    location ^~ /docs/ { return 404; }

    # Public contact receiver (deploy/contact). Exact match — wins over /api/ below,
    # so it stays PUBLIC (no auth) while every other /api/* is gated.
    location = /api/message {
        limit_except POST { deny all; }
        proxy_pass http://contact:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Admin, password-gated (HTTP Basic). Reaches the admin container. ----
    # NOTE: interim protection. Layer Cloudflare Access/passkey on top later, then
    # this basic-auth can be removed.
    location ^~ /admin {
        auth_basic           "Haus Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass           http://admin:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout   300s;   # Drive sync / large ops
    }
    location ^~ /api/ {
        auth_basic           "Haus Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass           http://admin:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout   300s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets: long cache. nginx serves Range (206) for <video> natively.
    location ~* \.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
